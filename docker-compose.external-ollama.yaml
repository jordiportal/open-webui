# Open WebUI con Ollama externo + Mock Brain Server
# Uso: docker compose -f docker-compose.external-ollama.yaml up -d
#
# Configura en .env:
#   OLLAMA_BASE_URL=https://tu-servidor-ollama:11434

services:
  mock-brain-server:
    build:
      context: ./dev
      dockerfile: Dockerfile
    container_name: mock-brain-server
    ports:
      - "${MOCK_SERVER_PORT:-8001}:8001"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - mock-brain-server
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS:-http://mock-brain-server:8001}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
